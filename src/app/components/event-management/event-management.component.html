<!-- Header Start -->
<div class="container-fluid page-header">
  <div class="container">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
      <h3 class="display-4 text-white text-uppercase">活動管理</h3>
      <div class="d-inline-flex text-white">
        <p class="m-0 text-uppercase"><a class="text-white" routerLink="/">首頁</a></p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase">活動管理</p>
      </div>
    </div>
  </div>
</div>
<!-- Header End -->
<h2 class="text-center my-4">活動管理</h2>

<!-- 新增活動按鈕 -->
<div class="container mb-4 text-end">
  <button class="btn btn-success" (click)="goToCreateEvent()">新增活動</button>
</div>

<!-- 活動列表 -->
<div class="container">
  <h3 class="mb-3">活動列表</h3>

  <div *ngIf="events.length === 0" class="alert alert-info text-center">目前沒有活動</div>

  <div class="list-group">
    <div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let event of events">
      <div>
        <!-- ✅ 顯示活動圖片 -->
        <img *ngIf="event.fEventImageUrl" [src]="event.fEventImageUrl" alt="活動圖片" width="100">
        <h5 class="mb-1">{{ event.fEventName }}</h5>
        <p class="mb-1 text-muted">
          {{ event.fEventStartDate | date:'yyyy-MM-dd HH:mm' }} ~
          {{ event.fEventEndDate | date:'yyyy-MM-dd HH:mm' }}
        </p>
      </div>
      <div>
        <button class="btn btn-sm btn-warning me-2" (click)="goToEditEvent(event.fEventId)">編輯</button>
        <button class="btn btn-sm btn-danger" (click)="deleteEvent(event.fEventId)">刪除</button>
      </div>
    </div>
  </div>
</div>
