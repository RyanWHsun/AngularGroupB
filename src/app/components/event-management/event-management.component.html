<div class="container">
  <h2>活動管理</h2>

  <!-- 🚀 新增活動按鈕 -->
  <button class="btn btn-primary mb-3" (click)="openCreateEventDialog()">新增活動</button>

  <!-- 🔹 活動列表 -->
  <table class="table">
    <thead>
      <tr>
        <th>活動名稱</th>
        <th>開始日期</th>
        <th>結束日期</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let event of events">
        <td>{{ event.fEventName }}</td>
        <td>{{ event.fEventStartDate | date: 'yyyy-MM-dd' }}</td>
        <td>{{ event.fEventEndDate | date: 'yyyy-MM-dd' }}</td>
        <td>
          <button class="btn btn-warning me-2" (click)="openEditEventDialog(event)">編輯</button>
          <button class="btn btn-danger" (click)="deleteEvent(event.fEventId)">刪除</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
