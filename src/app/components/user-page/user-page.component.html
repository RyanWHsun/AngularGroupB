<!-- Header Start -->
<div class="container-fluid page-header">
  <div class="container">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
      <h3 class="display-4 text-white text-uppercase">帳戶</h3>
      <div class="d-inline-flex text-white">
        <p class="m-0 text-uppercase"><a class="text-white" routerLink="">首頁</a></p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase">帳戶</p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase">帳戶主頁</p>
      </div>
    </div>
  </div>
</div>
<!-- Header End -->

<!-- Booking Start -->

<div class="container-fluid booking mt-5 pb-5 search-bar-container">
  <div class="container pb-1">
    <div class="bg-light shadow pb-0" style=" padding: 30px;">
      <div class="row align-items-center " style="min-height: 60px;">

        <div class="w-100 row mx-3 mb-4">

          <div class="col-4 " (click)="goToShoppingCart()">
            <div class="p-2 threeBtn d-flex justify-content-between">
              <i class="fa-solid fa-cart-shopping" style="font-size:25px"></i>
              <span style="font-weight: bold; font-size: 20px;">購物車</span>
              <span style="opacity: 0;">空</span>
            </div>
          </div>

          <div class="col-4" (click)="goToWallet()">
            <div class="p-2 threeBtn d-flex justify-content-between">

              <i class="fa-solid fa-sack-dollar" style="font-size:25px"></i>
              <span style="font-weight: bold; font-size: 20px;">點數</span>
              <span style="opacity: 0;">空</span>

            </div>
          </div>

          <div class="col-4 " (click)="goToUserEdit()">
            <div class="p-2 threeBtn d-flex justify-content-between">

              <i class="fa-solid fa-pen-to-square" style="font-size:25px"></i>
              <span style="font-weight: bold; font-size: 20px;">修改資料</span>
              <span style="opacity: 0;">空</span>

            </div>
          </div>


        </div>

      </div>
    </div>
  </div>
</div>
<!-- Booking End -->
