<!-- start your coding here-->
<div class="container">
  <div class="row">
    <!-- 推薦 -->
    <div class="col-2">
      <div class="mb-5 fixed-sidebar">
        <h4 class="text-uppercase mb-2" style="letter-spacing: 5px;">推薦商品</h4>
        <a class="d-flex flex-column align-items-center text-decoration-none bg-white mb-3 border" href="">
          <img class="img-fluid w-100" src="/assets/images/p0001.jpg" alt="">
          <h6 class="text-center">28吋行李箱</h6>
        </a>
        <a class="d-flex flex-column align-items-center text-decoration-none bg-white mb-3 border" href="">
          <img class="img-fluid w-100" src="/assets/images/p0002.jpg" alt="">
          <h6 class="text-center">二手帳篷組</h6>
        </a>
        <a class="d-flex flex-column align-items-center text-decoration-none bg-white mb-3 border" href="">
          <img class="img-fluid w-100" src="/assets/images/p0003.jpg" alt="">
          <h6 class="text-center">超CP值登山包</h6>
        </a>
      </div>
    </div>
    <!-- 文章 -->
    <div class="col-8" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="300"
      (scrolled)="onScroll()">
      <div *ngFor="let data of datas" class="container-fluid mb-3" style="width: 90%;">
        <!-- Post Wrapper -->
        <div class="post border rounded p-3">
          <!-- Header -->
          <div class="d-flex align-items-center mb-2">
            <img [src]="userData[data['fUserId']].image" class="rounded-circle mr-2" style="width: 5%;">
            <strong>{{userData[data['fUserId']].nickName}}</strong>
          </div>

          <!-- Image -->
          <div *ngIf="imageData[data['fPostId']] && imageData[data['fPostId']].length > 0" class="mb-2">
            <img [src]="imageData[data['fPostId']][0]" class="w-100" style='height: 444.75px;object-fit: cover' />
          </div>

          <div *ngIf="!imageData[data['fPostId']] || imageData[data['fPostId']].length == 0" class="mb-2">
            <img src="/assets/images/noImage.jpg" class="w-100" style='height: 444.75px;object-fit: cover' />
          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-start mb-2">
            <button class="btn mr-2 shadow-none"><i class="fa-regular fa-heart" style="color: #000000;"></i></button>
            <button class="btn mr-2 shadow-none" (click)="toggleComments(data['fPostId'])"><i
                class="fa-regular fa-comment" style="color: #000000;"></i></button>
          </div>

          <!-- Likes and Caption -->
          <p class="mb-1"><strong>10個讚</strong></p>
          <p *ngIf="!activePostIds.includes(data['fPostId'])"><strong>{{userData[data['fUserId']].nickName}}
            </strong>{{data['fTitle']}}</p>

          <!-- Comment Section -->
          <div *ngIf="activePostIds.includes(data['fPostId'])" class="comment-container">
            <p><strong>{{userData[data['fUserId']].nickName}} </strong>{{data['fTitle']}}</p>
            <div [innerHTML]="contentData[data['fPostId']]">
            </div>
            <hr>
            <p *ngFor="let comments of commentDatas[data['fPostId']]"><strong>{{comments.fUserNickName}}
              </strong>{{comments.fContent}}</p>
          </div>
          <div class="comment-input-box">
            <input type="text" class="commentInput w-100 ml-2" placeholder="留言......"
              [(ngModel)]="commentTexts[data['fPostId']]">
            <a role="button" class="mr-2" (click)="submitComment(data['fPostId'])"><i
                class="fa-solid fa-paper-plane"></i></a>
          </div>
        </div>

      </div>
      <div *ngIf="loading" class="loading-spinner"></div>
    </div>
    <div class="col-2">
      <div class="contacts-list fixed-sidebar">
        <h4 class="text-uppercase mb-4" style="letter-spacing: 5px;">聯絡人</h4>
        <div class="contact-card">
          <img src="/assets/images/head001.jpg" class="avatar">
          <span class="name">葉大仁</span>
        </div>
        <div class="contact-card">
          <img src="/assets/images/head003.jpg" class="avatar">
          <span class="name">蔡馬寇</span>
        </div>
        <div class="contact-card">
          <img src="/assets/images/head002.jpg" class="avatar">
          <span class="name">王瑞安</span>
        </div>
        <div class="contact-card">
          <img src="/assets/images/head005.jpg" class="avatar">
          <span class="name">艾小葉</span>
        </div>
      </div>
    </div>
  </div>
</div>
