<!-- Header Start -->
<div class="container-fluid page-header">
  <div class="container">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
      <h3 class="display-4 text-white text-uppercase">我的點數</h3>
      <div class="d-inline-flex text-white">
        <p class="m-0 text-uppercase"><a class="text-white" routerLink="">首頁</a></p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase"><a class="text-white" [routerLink]="['/user/page']">帳戶主頁</a></p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase">我的點數</p>
      </div>
    </div>
  </div>
</div>
<!-- Header End -->

<!-- Content -->
<div class="container-fluid py-5 ">
  <div class="container bg-light shadow p-3 ">
    <div class="container mt-5">
      <!-- 錢包資訊區域 -->
      <div class="wallet-header">
        <h3>平台錢包金流</h3>
        <p>查看您的平台錢包餘額與交易紀錄。</p>
        <hr>
        <div class="row">
          <div class="col-md-6">
            <h4>可用餘額</h4>
            <p class="display-4 text-success">NT${{availableBalance|number}}</p>
          </div>
          <div class="col-md-6 d-flex justify-content-end align-items-center">
            <div class="mt-3 mx-3 justify-content-between mb-2">
              <button class="btn btn-success rounded btn-block btn-lg mx-3">儲值</button>
              <button class="btn btn-warning rounded btn-block btn-lg mt-2 mx-3">提款</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 近期交易紀錄 -->
      <div class="card">
        <div class="card-header">
          <h5>近期交易紀錄</h5>
        </div>
        <div class="card-body">
          <table class="table table-striped transaction-table">
            <thead>
              <tr>
                <th>交易ID</th>
                <th>日期</th>
                <th>交易描述</th>
                <th>金額</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let transaction of walletData">
                <td>{{transaction.fTradeId}}</td>
                <td>{{transaction.fChangeTime | date: 'yyyy/MM/dd'}}</td>
                <td>{{transaction.fChangeLog }}</td>
                <td class="text-danger"
                  [ngClass]="{'text-success': transaction.fAmountChange >= 0, 'text-danger': transaction.fAmountChange < 0}">
                  {{transaction.fAmountChange | number}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
