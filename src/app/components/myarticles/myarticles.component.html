<!-- Header Start -->
<div class="container-fluid page-header">
  <div class="container">
    <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 400px">
      <h3 class="display-4 text-white text-uppercase">文章</h3>
      <div class="d-inline-flex text-white">
        <p class="m-0 text-uppercase"><a class="text-white" routerLink="/socialmedia">社群</a></p>
        <i class="fa fa-angle-double-right pt-1 px-3"></i>
        <p class="m-0 text-uppercase">文章</p>
      </div>
    </div>
  </div>
</div>
<!-- Header End -->

<!-- Booking Start -->
<div class="container-fluid booking mt-5 pb-5">
  <div class="container pb-5">
    <div class="bg-light shadow" style="padding: 30px;">
      <div class="row align-items-center" style="min-height: 60px;">
        <div class="col-md-2">
          <button class="btn btn-primary btn-block" style="height: 47px; margin-top: -2px;" data-toggle="modal"
            data-target="#modal" (click)="reset()">新增</button>
        </div>
        <div class="col-md-8">
          <div class="row">
            <div class="col-md-4">
              <div class="mb-3 mb-md-0">
                <div class="date" id="date1" data-target-input="nearest">
                  <input type="text" class="form-control p-4 datetimepicker-input" placeholder="Depart Date"
                    data-target="#date1" data-toggle="datetimepicker" />
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3 mb-md-0">
                <div class="date" id="date2" data-target-input="nearest">
                  <input type="text" class="form-control p-4 datetimepicker-input" placeholder="Return Date"
                    data-target="#date2" data-toggle="datetimepicker" />
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3 mb-md-0">
                <select class="custom-select px-4" style="height: 47px;">
                  <option selected>Duration</option>
                  <option value="1">Duration 1</option>
                  <option value="2">Duration 1</option>
                  <option value="3">Duration 1</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary btn-block" type="submit"
            style="height: 47px; margin-top: -2px;">Submit</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Booking End -->

<div>{{editorData}}</div>
<div [innerHTML]="finalData">123</div>

<div id="myArticle" class="container mt-4">
  <div class="row">
    <div *ngFor="let data of datas" class="col-4" style="padding:0 10px 10px 10px;">
      <div *ngIf="imageData[data['fPostId']] && imageData[data['fPostId']].length > 0" class="image-container">
        <img [src]="imageData[data['fPostId']][0]" class="w-100" />
        <div class="overlay">
          <p><i class="fas fa-heart"></i> 120</p>
          <p><i class="fas fa-comment"></i> 45</p>
        </div>
      </div>
      <div *ngIf="!imageData[data['fPostId']] || imageData[data['fPostId']].length == 0" class="image-container">
        <img src="/assets/images/noImage.jpg" class="w-100" />
        <div class="overlay">
          <p><i class="fas fa-heart"></i> 10</p>
          <p><i class="fas fa-comment"></i> 10</p>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-custom modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">建立新貼文</h5>
        <button type="button" class="close" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-8">
            <img [src]="imagePreview || 'assets/images/noImage.jpg'" class="w-100 h-100" style="object-fit: cover;
    object-position: center;">
          </div>
          <div class="col-4">
            <input type="text" class="form-control mb-3" placeholder="輸入文章標題!" [(ngModel)]="articleTitle">
            <div class="editor-container">
              <ckeditor [editor]="Editor" [config]="config" [(ngModel)]="editorData" *ngIf="Editor && config" />
            </div>
            <button type="button" class="btn btn-secondary" (click)="fileInput.click()">選擇圖片</button>
            <input type="file" #fileInput (change)="onFileSelected($event)" class="d-none">
            <label for="articleStatus" class="mt-3 ml-1">文章狀態：</label>
            <select id="articleStatus" [(ngModel)]="articleStatus">
              <option *ngFor="let status of statuses" [value]="status.value">
                {{ status.label }}
              </option>
            </select>
            <button type="button" class="btn btn-primary mt-2 float-right" data-dismiss="modal"
              (click)="save()">確認</button>
          </div>
        </div>
      </div>
    </div>
  </div>
