<!-- Title -->
<div class="text-center mb-1 pb-1">
  <h6 class="text-primary text-uppercase" style="letter-spacing: 5px;">Create Product</h6>
  <h1>新增商品</h1>
</div>

<div class="container mt-5">
  <h2 class="mb-4">新增商品</h2>

  <form [formGroup]="productForm" (ngSubmit)="submitForm()">
    <!-- 商品名稱 -->
    <div class="form-group">
      <label for="productName">商品名稱</label>
      <input type="text" id="productName" class="form-control" formControlName="fProductName" required />
      <small *ngIf="productForm.get('fProductName')?.invalid && productForm.get('fProductName')?.touched"
        class="text-danger">
        商品名稱至少需要 3 個字元
      </small>
    </div>

    <!-- 商品價格 -->
    <div class="form-group">
      <label for="productPrice">價格</label>
      <input type="number" id="productPrice" class="form-control" formControlName="fProductPrice" required />
    </div>

    <!-- 商品描述 -->
    <div class="form-group">
      <label for="productDescription">商品描述</label>
      <textarea id="productDescription" class="form-control" rows="3" formControlName="fProductDescription"></textarea>
    </div>

    <!-- 商品狀態 -->
    <div class="form-group">
      <label>是否上架</label>
      <div>
        <input type="radio" id="onSale" formControlName="fIsOnSales" [value]="true" />
        <label for="onSale">販售中</label>

        <input type="radio" id="offSale" formControlName="fIsOnSales" [value]="false" />
        <label for="offSale">未販售</label>
      </div>
    </div>

    <!-- 商品庫存 -->
    <div class="form-group">
      <label for="productStock">庫存數量</label>
      <input type="number" id="productStock" class="form-control" formControlName="fStock" required />
    </div>

    <!-- 圖片上傳 -->
    <div class="form-group">
      <label for="productImage">商品圖片</label>
      <input type="file" class="form-control-file" (change)="onImageSelected($event)" />

      <!-- 預覽圖片 -->
      <div *ngIf="imagePreview" class="mt-3">
        <p>圖片預覽:</p>
        <img [src]="imagePreview" class="img-thumbnail" style="max-width: 200px" />
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button type="submit" class="btn btn-primary mt-3" [disabled]="productForm.invalid">新增商品</button>
  </form>
</div>
