<div class="container-fluid py-5">
  <div class="container pt-5 pb-3">
    <div class="text-center mb-3 pb-3">
      <h6 class="text-primary text-uppercase">活動列表</h6>
      <h1>熱門活動推薦</h1>
    </div>

    <div class="carousel-container position-relative">
      <!-- ◀️ 左按鈕 -->
      <button class="carousel-btn left" (click)="prevEvent()">&#10094;</button>

      <div class="carousel-content row">
        <div class="col-xl-4 col-lg-6 col-md-6 col-sm-12 mb-4" *ngFor="let event of displayedEvents">
          <div class="package-item bg-white shadow-sm rounded-lg mb-2">

            <!-- ✅ 圖片 (點擊可上傳) -->
            <img class="img-fluid event-image rounded-top"
                 [src]="event.fEventImageUrl || 'assets/images/noImage.jpg'"
                 alt="活動圖片"
                 (click)="triggerFileInput(event.fEventId)"
                 title="點擊上傳新圖片"
                 style="cursor: pointer; transition: transform 0.2s ease-in-out;"
                 (mouseover)="event.isHovered = true"
                 (mouseout)="event.isHovered = false">

            <!-- ✅ 隱藏的 input file，綁定 eventId -->
            <input type="file"
                   [id]="'fileInput' + event.fEventId"
                   (change)="onFileSelected($event, event.fEventId)"
                   style="display: none;">

            <div class="p-4">
              <div class="d-flex justify-content-between mb-3">
                <small><i class="fa fa-map-marker-alt text-primary mr-2"></i>{{ event.fLocation || '未知地點' }}</small>
                <small *ngIf="event.fDuration"><i class="fa fa-calendar-alt text-primary mr-2"></i>{{ event.fDuration }} 天</small>
                <small *ngIf="event.fParticipant"><i class="fa fa-user text-primary mr-2"></i>{{ event.fParticipant }} 人</small>
              </div>

              <h5 class="text-dark">{{ event.fEventName }}</h5>
              <p class="text-muted">{{ event.fEventDescription }}</p>

              <div class="border-top mt-4 pt-4">
                <h5 class="m-0">NT$ {{ event.fPrice | number }}</h5>
              </div>

              <button class="btn btn-outline-warning mt-3" (click)="toggleSaveEvent(event)">
                <i class="fa" [ngClass]="{'fa-star': isEventSaved(event.fEventId), 'fa-star-o': !isEventSaved(event.fEventId)}"></i>
                收藏
              </button>

              <a class="btn btn-primary mt-3" [routerLink]="['/event/detail', event.fEventId]">查看詳情</a>
            </div>
          </div>
        </div>
      </div>

      <!-- ▶️ 右按鈕 -->
      <button class="carousel-btn right" (click)="nextEvent()">&#10095;</button>
    </div>
  </div>
</div>
