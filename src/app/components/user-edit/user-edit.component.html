<!-- start your coding here-->

<div class="container-fluid py-5">
  <div class="container py-5">
    <div class="text-center mb-3 pb-3">
      <h6 class="text-primary text-uppercase" style="letter-spacing: 5px;">帳戶修改</h6>
      <h1>修改帳戶</h1>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="contact-form bg-white" style="padding: 30px;">
          <div id="success"></div>

          <form name="sentMessage" id="contactForm" novalidate="novalidate" #f="ngForm">



            <!-- 用戶頭像輸入 -->
            <div class=" mb-3">
              <h5>用戶頭像</h5>
              <div class="col-lg-4 col-md-6 mb-4" (click)="changeImgDiv()">
                <div class="w-100 img-div destination-item">

                  <img class="img-fluid img-divfull mb-5" [src]="user.fUserImage||'assets/images/noImage.jpg'">

                </div>
              </div>
              <input type="file" #fileInput (change)="changeImg($event)" id="userImage" accept="image/*"
                name="fUserImage" style="display: none;" />
            </div>



            <!--

            <div class="control-group mb-2">
              <h5>用戶頭像</h5>
              <div class="col-lg-4 col-md-6 mb-4">
                <div class="destination-item position-relative overflow-hidden mb-2">

                  <img class="img-fluid mb-5" [src]="user.fUserImage||'assets/images/noImage.jpg'" alt="">
                  <input type="file" (change)="changeImg($event)" id="userImage" accept="image/*" name="fUserImage" />
                </div>
              </div>
            </div> -->

            <!-- 用戶名稱輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase"> 用戶名稱</h5>
              <input type="text" class="form-control p-4" id="userName" placeholder="用戶名稱最多20字" required="required"
                maxlength="20" [(ngModel)]="user.fUserName" name="fUserName" (keydown)="preventSpace($event)"
                #name="ngModel" />
              <p class="help-block text-danger" *ngIf="name.invalid && name.touched">請輸入用戶名稱</p>
            </div>

            <!-- 暱稱輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase">暱稱</h5>
              <input type="text" class="form-control p-4" id="userName" placeholder="請輸入用戶暱稱" required="required"
                maxlength="20" [(ngModel)]="user.fUserNickName" (keydown)="preventSpace($event)" name="fUserNickName"
                #nickName="ngModel" />
              <p class="help-block text-danger" *ngIf="nickName.invalid && nickName.touched">請輸入用戶暱稱</p>
            </div>

            <!-- 性別輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase">性別</h5>
              <select type="text" class="form-control" id="userSex" placeholder="請輸入用戶性別" required="required"
                data-validation-required-message="請輸入用戶性別" [(ngModel)]="user.fUserSex" name="fUserSex">
                <option value="不願透露">不願透露</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>

            <!-- 生日輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase">生日</h5>
              <input type="date" class="form-control p-4" id="userBirthday" placeholder="請輸入用戶生日" required="required"
                value="1990-01-01" data-validation-required-message="請輸入用戶生日" [(ngModel)]="user.fUserBirthday"
                name="fUserBirthday" />
            </div>

            <!-- 電話輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase">電話</h5>
              <input type="text" class="form-control p-4" id="userPhone" placeholder="請輸入用戶電話"
                [(ngModel)]="user.fUserPhone" name="fUserPhone" />
            </div>

            <!-- 地址輸入 -->
            <div class="control-group mb-3">
              <h5 class="text-uppercase">地址</h5>
              <input type="text" class="form-control p-4" id="userName" placeholder="請輸入用戶地址"
                [(ngModel)]="user.fUserAddress" name="fUserAddress" />
            </div>
          </form>


          <!-- 送出按鈕 -->
          <div class="text-center">
            <button class="btn btn-primary py-3 px-4 mx-3" type="text" id="sendMessageButton"
              (click)="submitUserEdit(f)">確認修改
            </button>

            <button class="btn btn-secondary py-3 px-4" type="text" (click)="goToUserPage()">取消
            </button>
          </div>





        </div>
      </div>
    </div>
  </div>
</div>
